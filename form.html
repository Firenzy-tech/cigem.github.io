<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Agregar Cliente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            color: #333;
        }
        .error {
            color: red;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h2>Formulario de Agregar Cliente</h2>
    <form id="customerForm" action="/submit-form" method="post">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required>
        <span class="error" id="nameError"></span>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <span class="error" id="emailError"></span>

        <label for="phone">Teléfono:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
        <span class="error" id="phoneError"></span>

        <label for="address">Dirección:</label>
        <textarea id="address" name="address" required></textarea>
        <span class="error" id="addressError"></span>

        <button type="submit">Agregar Cliente</button>
    </form>

    <script>
        document.getElementById('customerForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            let hasError = false;
            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const phoneError = document.getElementById('phoneError');
            const addressError = document.getElementById('addressError');

            if (name.trim() === '') {
                nameError.textContent = 'Por favor, ingrese un nombre.';
                hasError = true;
            } else {
                nameError.textContent = '';
            }

            if (email.trim() === '') {
                emailError.textContent = 'Por favor, ingrese un email.';
                hasError = true;
            } else {
                emailError.textContent = '';
            }

            if (phone.trim() === '') {
                phoneError.textContent = 'Por favor, ingrese un número de teléfono.';
                hasError = true;
            } else {
                phoneError.textContent = '';
            }

            if (address.trim() === '') {
                addressError.textContent = 'Por favor, ingrese una dirección.';
                hasError = true;
            } else {
                addressError.textContent = '';
            }

            if (!hasError) {
                alert('Cliente agregado exitosamente!');
                // Aquí puedes agregar la lógica para enviar el formulario al servidor
            }
        });
    </script>
</body>
</html>
